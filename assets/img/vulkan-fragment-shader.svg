<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">A fragment shader applies lighting to a triangle</title><desc id="desc">A plain blue triangle on the left becomes a blue triangle with bright highlights and dark shading on the right.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#27334d"/></marker><radialGradient id="lit" cx="70%" cy="22%" r="80%"><stop offset="0" stop-color="#fff"/><stop offset=".2" stop-color="#a9dcff"/><stop offset=".5" stop-color="#3d9fe8"/><stop offset="1" stop-color="#123b83"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="8"/></filter></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.title{font-size:25px;font-weight:800}.label{font-size:21px;font-weight:700}.small{font-size:17px}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:18}</style><rect width="900" height="430" fill="#f7f9fc"/><text x="450" y="38" text-anchor="middle" class="title">Fragment shader: from flat colour to a lit surface</text><rect x="35" y="70" width="330" height="285" class="panel"/><text x="200" y="112" text-anchor="middle" class="label">Before shading</text><path d="M200 145 L90 315 L310 315 Z" fill="#1769c2" stroke="#123b83" stroke-width="4"/><text x="200" y="345" text-anchor="middle" class="small">every fragment has the same blue colour</text><path d="M395 212 H505" stroke="#27334d" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="450" y="188" text-anchor="middle" class="small">fragment shader</text><rect x="535" y="70" width="330" height="285" class="panel"/><text x="700" y="112" text-anchor="middle" class="label">After shading</text><ellipse cx="748" cy="170" rx="55" ry="32" fill="#fff" opacity=".75" filter="url(#glow)"/><path d="M700 145 L590 315 L810 315 Z" fill="url(#lit)" stroke="#123b83" stroke-width="4"/><ellipse cx="745" cy="175" rx="28" ry="16" fill="#fff" opacity=".75"/><text x="700" y="345" text-anchor="middle" class="small">lighting creates highlights and shadow</text></svg>

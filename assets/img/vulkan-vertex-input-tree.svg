<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc">
  <title id="title">Three vertices, each with a position and a color</title>
  <desc id="desc">A triangle is made from three vertex records. Each vertex record contains both a position and a color.</desc>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: #172033; }
      .vertex { fill: #eef2ff; stroke: #6366f1; stroke-width: 2.5; }
      .position { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; }
      .color { fill: #fff7ed; stroke: #f97316; stroke-width: 2; }
      .title { font-size: 27px; font-weight: 750; }
      .head { font-size: 22px; font-weight: 700; }
      .label { font-size: 19px; font-weight: 650; }
      .detail { font-size: 16px; fill: #475569; }
      .edge { stroke: #94a3b8; stroke-width: 2; }
    </style>
  </defs>
  <text class="title" x="550" y="48" text-anchor="middle">One triangle = three vertices</text>
  <text class="detail" x="550" y="77" text-anchor="middle">Every vertex record contains both a position and a color.</text>

  <g>
    <rect class="vertex" x="50" y="112" width="300" height="470" rx="20"/>
    <text class="head" x="200" y="153" text-anchor="middle">Vertex 0</text>
    <line class="edge" x1="75" y1="174" x2="325" y2="174"/>
    <rect class="position" x="80" y="202" width="240" height="125" rx="14"/>
    <text class="label" x="200" y="240" text-anchor="middle">Position</text>
    <text class="detail" x="200" y="273" text-anchor="middle">(0.0, -0.5)</text>
    <rect class="color" x="80" y="357" width="240" height="150" rx="14"/>
    <text class="label" x="200" y="395" text-anchor="middle">Color</text>
    <circle cx="176" cy="445" r="18" fill="#ef4444"/>
    <text class="detail" x="205" y="451">red (1, 0, 0)</text>
    <text class="detail" x="200" y="548" text-anchor="middle">one point's complete data</text>
  </g>

  <g>
    <rect class="vertex" x="400" y="112" width="300" height="470" rx="20"/>
    <text class="head" x="550" y="153" text-anchor="middle">Vertex 1</text>
    <line class="edge" x1="425" y1="174" x2="675" y2="174"/>
    <rect class="position" x="430" y="202" width="240" height="125" rx="14"/>
    <text class="label" x="550" y="240" text-anchor="middle">Position</text>
    <text class="detail" x="550" y="273" text-anchor="middle">(0.5, 0.5)</text>
    <rect class="color" x="430" y="357" width="240" height="150" rx="14"/>
    <text class="label" x="550" y="395" text-anchor="middle">Color</text>
    <circle cx="526" cy="445" r="18" fill="#22c55e"/>
    <text class="detail" x="555" y="451">green (0, 1, 0)</text>
    <text class="detail" x="550" y="548" text-anchor="middle">one point's complete data</text>
  </g>

  <g>
    <rect class="vertex" x="750" y="112" width="300" height="470" rx="20"/>
    <text class="head" x="900" y="153" text-anchor="middle">Vertex 2</text>
    <line class="edge" x1="775" y1="174" x2="1025" y2="174"/>
    <rect class="position" x="780" y="202" width="240" height="125" rx="14"/>
    <text class="label" x="900" y="240" text-anchor="middle">Position</text>
    <text class="detail" x="900" y="273" text-anchor="middle">(-0.5, 0.5)</text>
    <rect class="color" x="780" y="357" width="240" height="150" rx="14"/>
    <text class="label" x="900" y="395" text-anchor="middle">Color</text>
    <circle cx="876" cy="445" r="18" fill="#3b82f6"/>
    <text class="detail" x="905" y="451">blue (0, 0, 1)</text>
    <text class="detail" x="900" y="548" text-anchor="middle">one point's complete data</text>
  </g>

  <text class="detail" x="550" y="615" text-anchor="middle">Position and color belong together in each vertex.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">Physical device and logical devices in Vulkan</title>
  <desc id="desc">One physical GPU exposes capabilities. Multiple logical devices can be created from it, each enabling different features and queues.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .small { font-size: 19px; }
    .label { font-size: 25px; font-weight: 700; }
    .title { font-size: 30px; font-weight: 800; }
    .box { stroke: #27334d; stroke-width: 3; rx: 18; }
    .arrow { stroke: #27334d; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    .feature { stroke: #27334d; stroke-width: 2; rx: 10; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#27334d"/></marker>
  </defs>
  <rect width="1100" height="650" fill="#f7f9fc"/>
  <text x="550" y="48" text-anchor="middle" class="title">One physical device, several logical devices</text>

  <rect x="35" y="100" width="270" height="450" class="box" fill="#dce8ff"/>
  <text x="170" y="165" text-anchor="middle" class="label">Physical device</text>
  <text x="170" y="198" text-anchor="middle" class="small">the real GPU</text>
  <text x="65" y="260" class="small">Available capabilities:</text>
  <rect x="65" y="285" width="210" height="42" class="feature" fill="#fff3c4"/>
  <text x="170" y="313" text-anchor="middle" class="small">Vulkan 1.3</text>
  <rect x="65" y="340" width="210" height="42" class="feature" fill="#fff3c4"/>
  <text x="170" y="368" text-anchor="middle" class="small">graphics queues</text>
  <rect x="65" y="395" width="210" height="42" class="feature" fill="#fff3c4"/>
  <text x="170" y="423" text-anchor="middle" class="small">dynamic rendering</text>
  <rect x="65" y="450" width="210" height="42" class="feature" fill="#fff3c4"/>
  <text x="170" y="478" text-anchor="middle" class="small">swapchain support</text>

  <path d="M305 210 H365" class="arrow"/><path d="M305 325 H365" class="arrow"/><path d="M305 440 H365" class="arrow"/>

  <g>
    <rect x="365" y="85" width="690" height="145" class="box" fill="#bdeccf"/>
    <text x="395" y="130" class="label">Logical device A</text>
    <text x="395" y="164" class="small">Application renderer</text>
    <text x="700" y="130" class="small">enabled features:</text>
    <text x="700" y="164" class="small">dynamic rendering · swapchain</text>
    <text x="700" y="195" class="small">1 graphics queue</text>
  </g>
  <g>
    <rect x="365" y="255" width="690" height="145" class="box" fill="#ffd7a3"/>
    <text x="395" y="300" class="label">Logical device B</text>
    <text x="395" y="334" class="small">Compute application</text>
    <text x="700" y="300" class="small">enabled features:</text>
    <text x="700" y="334" class="small">compute · storage buffers</text>
    <text x="700" y="365" class="small">1 compute queue</text>
  </g>
  <g>
    <rect x="365" y="425" width="690" height="145" class="box" fill="#e5d8ff"/>
    <text x="395" y="470" class="label">Logical device C</text>
    <text x="395" y="504" class="small">Minimal application</text>
    <text x="700" y="470" class="small">enabled features:</text>
    <text x="700" y="504" class="small">basic Vulkan features</text>
    <text x="700" y="535" class="small">1 transfer queue</text>
  </g>
  <text x="550" y="620" text-anchor="middle" class="small">The physical device describes what is possible; each logical device selects an application-specific configuration.</text>
</svg>

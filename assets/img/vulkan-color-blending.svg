<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title desc"><title id="title">Color blending combines overlapping red and blue triangles</title><desc id="desc">Two separate triangles, one red and one blue, overlap on the right. The overlapping region becomes purple when their colours are blended.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.title{font-size:25px;font-weight:800}.label{font-size:21px;font-weight:700}.small{font-size:17px}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:18}.arrow{stroke:#27334d;stroke-width:4;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#27334d"/></marker><clipPath id="overlap"><path d="M665 125 L555 315 L775 315 Z"/></clipPath></defs><rect width="900" height="460" fill="#f7f9fc"/><text x="450" y="38" text-anchor="middle" class="title">Color blending: overlapping colours become a mixture</text><rect x="35" y="70" width="330" height="320" class="panel"/><text x="200" y="112" text-anchor="middle" class="label">Before blending</text><path d="M125 155 L55 295 L195 295 Z" fill="#e53935" stroke="#a51f24" stroke-width="4"/><path d="M275 155 L205 295 L345 295 Z" fill="#2878d0" stroke="#174d94" stroke-width="4"/><text x="125" y="340" text-anchor="middle" class="small">red fragment</text><text x="275" y="340" text-anchor="middle" class="small">blue fragment</text><path d="M395 230 H505" class="arrow"/><text x="450" y="207" text-anchor="middle" class="small">blend operation</text><rect x="535" y="70" width="330" height="320" class="panel"/><text x="700" y="112" text-anchor="middle" class="label">After blending</text><path d="M665 125 L555 315 L775 315 Z" fill="#e53935" fill-opacity=".78" stroke="#a51f24" stroke-width="4"/><path d="M735 125 L625 315 L845 315 Z" fill="#2878d0" fill-opacity=".78" stroke="#174d94" stroke-width="4"/><path d="M735 125 L625 315 L845 315 Z" fill="#8b3fa8" fill-opacity=".75" clip-path="url(#overlap)"/><text x="700" y="340" text-anchor="middle" class="small">overlap becomes purple</text><text x="700" y="365" text-anchor="middle" class="small">red and blue are combined</text></svg>
